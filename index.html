function bioDigestive1() {

    document.getElementById("content").innerHTML = `

    <div class="card lesson">

        <h2>Digestive System — Part 1</h2>

        <h3>What is Digestion?</h3>

        <p>
            <span class="term">Digestion</span> is the breakdown of large,
            complex food molecules into smaller, simple, soluble substances
            that can be absorbed and used by the body.
        </p>

        <h3>The Alimentary Canal</h3>

        <p>
            The <span class="term">alimentary canal</span> is the continuous
            passage through which food travels during digestion. In mammals,
            it includes the mouth, pharynx, oesophagus, stomach, small
            intestine, large intestine, rectum and anus.
        </p>

        <h3>Digestion in the Mouth</h3>

        <p>
            Digestion begins in the mouth. Teeth break food into smaller
            pieces and mix it with saliva. Saliva contains the enzyme
            <span class="term">amylase (tyalin)</span>, which begins the
            digestion of starch.
        </p>

        <div class="assignment">
            <b>Revision Focus:</b>
            Know the meaning of digestion and the main parts of the
            mammalian alimentary canal.
        </div>

    </div>
    `;
}


/* BIOLOGY WEEK 2 */

function bioDigestive2() {

    document.getElementById("content").innerHTML = `

    <div class="card lesson">

        <button class="back-btn" onclick="showBiology()">← Back to Biology</button>

        <div class="week">WEEK 2</div>

        <h2>Digestive System — Part 2</h2>

        <h3>Digestion in the Stomach</h3>

        <p>
            Food moves from the mouth through the oesophagus by
            <span class="term">peristalsis</span> and enters the stomach.
            The stomach stores and churns food while gastric juice helps
            in protein digestion.
        </p>

        <p>
            The enzyme <span class="term">pepsin</span> helps break down
            proteins. Hydrochloric acid provides an acidic medium and
            helps destroy many microorganisms.
        </p>

        <h3>Digestion in the Small Intestine</h3>

        <p>
            In the small intestine, food mixes with pancreatic juice,
            intestinal juice and bile. Bile helps with the
            <span class="term">emulsification of fats</span>.
        </p>

        <h3>Absorption</h3>

        <p>
            The small intestine contains numerous
            <span class="term">villi</span> which increase the surface
            area for absorption. Digested nutrients enter the blood,
            while products of fat digestion enter the
            <span class="term">lacteals</span>.
        </p>

        <div class="assignment">
            <b>Revision Focus:</b>
            Remember the major digestive enzymes and the importance
            of villi in absorption.
        </div>

    </div>
    `;
}

function bioTransport1() {

    <div class="card lesson">

        <div class="week">WEEK 3</div>

        <h2>Transport System — Part 1</h2>

        <h3>Meaning of Transport</h3>

        <p>
            <span class="term">Transport</span> is the movement of materials
            from where they are produced, absorbed or stored to places where
            they are needed or removed.
        </p>

        <h3>Why is Transport Necessary?</h3>

        <p>
            Cells need materials such as oxygen, water, nutrients and
            mineral salts. Waste products such as carbon dioxide and
            nitrogenous wastes must also be removed.
        </p>

        <h3>Transport in Small Organisms</h3>

        <p>
            Small organisms such as Amoeba and Paramecium can exchange
            many substances directly with their surroundings by
            <span class="term">diffusion</span>. Their large
            surface-area-to-volume ratio makes this possible.
        </p>

        <p>
            In larger organisms, diffusion alone is not fast enough,
            so specialised transport systems are required.
        </p>

        <div class="assignment">
            <b>Revision Focus:</b>
            Understand why diffusion is suitable for small organisms
            but insufficient for large multicellular organisms.
        </div>

    </div>
    `;
}


/* BIOLOGY WEEK 4 */

function bioTransport2() {

    <div class="card lesson">

        <button class="back-btn" onclick="showBiology()">← Back to Biology</button>

        <div class="week">WEEK 4</div>

        <h2>Transport System — Part 2</h2>

        <h3>Transport in Mammals</h3>

        <p>
            Mammals have a specialised circulatory system made up of the
            heart, blood and blood vessels. Blood transports substances
            around the body.
        </p>

        <h3>Blood</h3>

        <p>
            Blood contains <span class="term">plasma</span> and blood cells.
            Plasma transports dissolved substances including digested food,
            hormones, salts and waste products.
        </p>

        <h3>Blood Cells</h3>

        <p>
            <b>Red blood cells</b> transport oxygen using haemoglobin.
            <b>White blood cells</b> help defend the body against infection,
            while <b>platelets</b> help with blood clotting.
        </p>

        <h3>Blood Vessels</h3>

        <p>
            The three main blood vessels are
            <span class="term">arteries</span>,
            <span class="term">veins</span> and
            <span class="term">capillaries</span>.
            Arteries generally carry blood away from the heart, veins
            generally carry blood towards the heart, and capillaries are
            important sites of exchange.
        </p>

        <div class="assignment">
            <b>Revision Focus:</b>
            Learn the differences between arteries, veins and capillaries
            and the functions of the main blood cells.
        </div>

    </div>
    `;
}

<h2>📘 WAEC 2025 Physics — Questions 22–50</h2>

<div class="card">

<h3>Question 22</h3>
<p>A bucket of water of mass 10 kg is swung in a vertical circle of radius 1.2 m. At the bottom of the swing, its speed is 5 m/s. Determine the tension in the string. (g = 10 m/s²)</p>
<p><b>Answer: D — 308.3 N</b></p>
<p><b>Working:</b></p>
<p>T − mg = mv²/r</p>
<p>T = mg + mv²/r</p>
<p>T = (10 × 10) + (10 × 5²)/1.2</p>
<p>T = 100 + 250/1.2</p>
<p><b>T = 308.3 N</b></p>

<h3>Question 23</h3>
<p>A man's near point is 30 cm. Which eye defect is he most likely to suffer from?</p>
<p><b>Answer: A — Hypermetropia</b></p>
<p><b>Explanation:</b> A normal near point is about 25 cm. A person whose near point is farther than 25 cm has difficulty seeing nearby objects clearly. This is hypermetropia.</p>

<h3>Question 24</h3>
<p>White light can be produced by combinations of primary/additive colours.</p>
<p><b>Answer: B — I, II and III only</b></p>
<p><b>Explanation:</b> Red + Green + Blue produces white light. Magenta + Green also produces white, and the appropriate complementary combinations can produce white.</p>

<h3>Question 25</h3>
<p>A mirror can be used as a reflector in which of the following?</p>
<p><b>Answer: C — Reflector in microscope</b></p>
<p><b>Explanation:</b> A concave mirror can collect and converge light onto the object in an optical instrument.</p>

<h3>Question 26</h3>
<p>Which statement about stationary waves is NOT true?</p>
<p><b>Answer: A — Particles between adjacent nodes vibrate out of phase with each other.</b></p>
<p><b>Explanation:</b> Particles between two adjacent nodes vibrate in phase. Adjacent nodes are separated by λ/2.</p>

<h3>Question 27</h3>
<p>A pipe is closed at one end and open at the other. What frequencies accompany the fundamental frequency?</p>
<p><b>Answer: A — Odd integer multiples of the fundamental frequency</b></p>
<p><b>Explanation:</b> A closed pipe produces odd harmonics: 1st, 3rd, 5th, 7th, ...</p>

<h3>Question 28</h3>
<p>A radioactive substance of mass 512.0 g decays to 64.0 g. Determine the number of half-lives involved.</p>
<p><b>Answer: D — 3</b></p>
<p><b>Working:</b> 512 → 256 → 128 → 64.</p>
<p>There are three halvings, so there are <b>3 half-lives</b>.</p>

<h3>Question 29</h3>
<p>Two waves interfere destructively if their path difference is:</p>
<p><b>Answer: B — One-half wavelength</b></p>
<p><b>Explanation:</b> The simplest condition for destructive interference is λ/2 (and generally odd multiples of λ/2).</p>

<h3>Question 30</h3>
<p>Which statement about a step-up transformer is correct?</p>
<p><b>Answer: A — Less number of turns in the primary coil than in the secondary coil</b></p>
<p><b>Explanation:</b> A step-up transformer has Ns &gt; Np, so the secondary has more turns.</p>

<h3>Question 31</h3>
<p>What is the unit of magnetic flux density?</p>
<p><b>Answer: A — Tesla</b></p>

<h3>Question 32</h3>
<p>Meters installed in houses to monitor and evaluate the cost of electricity measure what physical quantity?</p>
<p><b>Answer: B — Energy</b></p>
<p><b>Explanation:</b> Electrical energy consumed is measured in kWh and used to calculate the electricity bill.</p>

<h3>Question 33</h3>
<p>What type of energy is stored by a dry Leclanché cell?</p>
<p><b>Answer: A — Chemical</b></p>
<p><b>Explanation:</b> The chemical energy in the cell is converted into electrical energy.</p>

<h3>Question 34</h3>
<p>A microphone transforms energy from:</p>
<p><b>Answer: B — Sound to electrical</b></p>

<h3>Question 35</h3>
<p>A radioactive substance has a fraction 1/10 left undecayed after 4 hours. Determine its half-life.</p>
<p><b>Working:</b></p>
<p>N/N₀ = (1/2)<sup>t/T</sup></p>
<p>1/10 = (1/2)<sup>4/T</sup></p>
<p>Using logarithms gives T ≈ 1.20 hours.</p>
<p><b>Answer: C — 1 hour (intended option)</b></p>
<p><b>Note:</b> The exact calculation gives about 1.20 h, so the printed options do not contain an exact value.</p>

<h3>Question 36</h3>
<p>Which situation demonstrates Newton's third law of motion?</p>
<p><b>Answer: C — A rocket propelled into space</b></p>
<p><b>Explanation:</b> The rocket pushes gases downward and the gases exert an equal and opposite force on the rocket.</p>

<h3>Question 37</h3>
<p>If both the force and velocity of a system are reduced by half, what happens to its power?</p>
<p><b>Answer: B — Reduced by a quarter</b></p>
<p><b>Working:</b> P = Fv</p>
<p>P' = (F/2)(v/2) = Fv/4</p>
<p>Therefore power becomes one-quarter of the original.</p>

<h3>Question 38</h3>
<p>A plane is inclined at 45° to the horizontal. Calculate its velocity ratio.</p>
<p><b>Answer: C — 1.41</b></p>
<p><b>Working:</b> VR = 1/sinθ</p>
<p>VR = 1/sin45° = 1/0.707 ≈ <b>1.41</b></p>

<h3>Question 39</h3>
<p>A body in a lift is moving downward with acceleration due to gravity. Which statement is correct?</p>
<p><b>Answer: D — Is weightless</b></p>
<p><b>Working:</b> Apparent weight R = m(g − a). Since a = g, R = 0.</p>

<h3>Question 40</h3>
<p>When pressure in oil is increased, its viscosity would be:</p>
<p><b>Answer: A — Increased</b></p>

<h3>Question 41</h3>
<p>What is the number of neutrons in <sup>14</sup><sub>6</sub>C?</p>
<p><b>Answer: B — 8</b></p>
<p><b>Working:</b> Number of neutrons = mass number − atomic number = 14 − 6 = <b>8</b>.</p>

<h3>Question 42</h3>
<p>The ice and steam points of a resistance thermometer are 12.0 Ω and 20.0 Ω respectively. Calculate the resistance at 10°C.</p>
<p><b>Answer: B — 12.8 Ω</b></p>
<p><b>Working:</b></p>
<p>(R − 12)/(20 − 12) = 10/100</p>
<p>(R − 12)/8 = 0.1</p>
<p>R − 12 = 0.8</p>
<p><b>R = 12.8 Ω</b></p>

<h3>Question 43</h3>
<p>A radium nucleus emits an alpha particle: <sup>226</sup><sub>88</sub>Ra → X + <sup>4</sup><sub>2</sub>He. Determine X.</p>
<p><b>Answer: A — <sup>222</sup><sub>86</sub>X</b></p>
<p><b>Working:</b> Mass number: 226 − 4 = 222. Atomic number: 88 − 2 = 86.</p>

<h3>Question 44</h3>
<p>A bullet of mass 25 mg moves at 250 m/s. Calculate its de Broglie wavelength. (h = 6.67 × 10<sup>−34</sup> Js)</p>
<p><b>Answer: C — 1.07 × 10<sup>−34</sup> m</b></p>
<p><b>Working:</b> λ = h/mv</p>
<p>λ = 6.67 × 10<sup>−34</sup> /(0.025 × 250)</p>
<p><b>λ ≈ 1.07 × 10<sup>−34</sup> m</b></p>

<h3>Question 45</h3>
<p>An electron moves at 5.0 × 10<sup>5</sup> m/s perpendicular to a magnetic field of 0.25 T. Calculate the magnetic force. (e = 1.6 × 10<sup>−19</sup> C)</p>
<p><b>Answer: B — 2.0 × 10<sup>−14</sup> N</b></p>
<p><b>Working:</b> F = qvB sin90°</p>
<p>F = (1.6 × 10<sup>−19</sup>)(5.0 × 10<sup>5</sup>)(0.25)</p>
<p><b>F = 2.0 × 10<sup>−14</sup> N</b></p>

<h3>Question 46</h3>
<p>A beam of light which appears to come from a point in space is said to be:</p>
<p><b>Answer: B — Divergent</b></p>
<p><b>Explanation:</b> Diverging rays spread away from a point.</p>

<h3>Question 47</h3>
<p>A sound made up of a large number of unrelated frequencies superimposed on each other is called:</p>
<p><b>Answer: C — Noise</b></p>

<h3>Question 48</h3>
<p>A box of mass 80 kg is pushed along a horizontal floor with a force of 200 N. If it moves with uniform velocity, calculate the coefficient of friction. (g = 10 m/s²)</p>
<p><b>Answer: A — 0.25</b></p>
<p><b>Working:</b></p>
<p>Uniform velocity means friction = 200 N.</p>
<p>R = mg = 80 × 10 = 800 N</p>
<p>μ = F/R = 200/800 = <b>0.25</b></p>

<h3>Question 49</h3>
<p>Thin wires can be drawn from platinum simply because platinum is:</p>
<p><b>Answer: B — Ductile</b></p>
<p><b>Explanation:</b> Ductility is the ability of a material to be drawn into thin wires.</p>
