<body>

    <header>
        <h1>📚 My SS2 Study Hub</h1>
        <p>Learn • Revise • Understand • Succeed</p>
    </header>

    <div class="container">

        <h2>Choose a Subject</h2>

        <div class="subjects">

            <button onclick="showSubject('biology')">
                🧬 Biology
            </button>

            <button onclick="showSubject('chemistry')">
                ⚗️ Chemistry
            </button>

            <button onclick="showSubject('physics')">
                ⚡ Physics
            </button>

            <button onclick="showSubject('math')">
                📐 Mathematics
            </button>

        </div>

        <div id="notes">
            <p>👆 Choose a subject above to see its notes.</p>
        </div>

    </div>

    <footer>
        <p>My SS2 Study Hub © 2026</p>
    </footer>

    <script>

        function showSubject(subject) {

            let notes = document.getElementById("notes");

            if (subject === "biology") {

                notes.innerHTML = `
                    <h3>🧬 Biology</h3>
                    <p><strong>Welcome to Biology!</strong></p>
                    <p>Here you will find Biology notes, topics and revision materials.</p>

                    <h4>Topics</h4>
                    <ul>
                        <li>Nutrition</li>
                        <li>Digestive System</li>
                        <li>Enzymes</li>
                        <li>Respiration</li>
                        <li>Transport System</li>
                    </ul>
                `;

            }

            else if (subject === "chemistry") {

                notes.innerHTML = `
                    <h3>⚗️ Chemistry</h3>
                    <p><strong>Welcome to Chemistry!</strong></p>
                    <p>Here you will find Chemistry notes and revision materials.</p>

                    <h4>Topics</h4>
                    <ul>
                        <li>Atomic Structure</li>
                        <li>Chemical Bonding</li>
                        <li>Gas Laws</li>
                        <li>Acids and Bases</li>
                        <li>Periodic Table</li>
                    </ul>
                `;

            }

            else if (subject === "physics") {

                notes.innerHTML = `
                    <h3>⚡ Physics</h3>
                    <p><strong>Welcome to Physics!</strong></p>
                    <p>Here you will find Physics notes and revision materials.</p>

                    <h4>Topics</h4>
                    <ul>
                        <li>Heat Transfer</li>
                        <li>Electricity</li>
                        <li>Ohm's Law</li>
                        <li>Motion</li>
                        <li>Waves</li>
                    </ul>
                `;

            }

            else if (subject === "math") {

                notes.innerHTML = `
                    <h3>📐 Mathematics</h3>
                    <p><strong>Welcome to Mathematics!</strong></p>
                    <p>Here you will find Mathematics topics and revision materials.</p>

                    <h4>Topics</h4>
                    <ul>
                        <li>Algebra</li>
                        <li>Quadratic Equations</li>
                        <li>Trigonometry</li>
                        <li>Statistics</li>
                        <li>Probability</li>
                    </ul>
                `;

            }

        }

    </script>

</body>
</html>
