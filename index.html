<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>My SS2 Study Hub</title>

<style>
* {
  box-sizing: border-box;
}

body {
  margin: 0;
  font-family: Arial, sans-serif;
  background: #0b0b0f;
  color: white;
}

header {
  text-align: center;
  padding: 35px 15px;
  background: #111318;
  border-bottom: 1px solid #333;
}

header h1 {
  margin: 0 0 10px;
  font-size: 30px;
}

header p {
  margin: 0;
  color: #aaa;
}

.container {
  max-width: 950px;
  margin: auto;
  padding: 20px;
}

.subjects {
  display: grid;
  grid-template-columns: repeat(auto-fit, minmax(140px, 1fr));
  gap: 15px;
  margin-bottom: 25px;
}

.subject {
  padding: 25px 10px;
  text-align: center;
  background: #15161b;
  border: 1px solid #3b3b42;
  border-radius: 14px;
  font-size: 18px;
  font-weight: bold;
  cursor: pointer;
}

.subject:hover {
  background: #202126;
}

.subject.active {
  background: #25262d;
}

.card {
  background: #15161b;
  border: 1px solid #333;
  border-radius: 14px;
  padding: 20px;
  margin-bottom: 15px;
}

.card h2 {
  margin-top: 0;
}

.card h3 {
  margin-top: 0;
}

.answer {
  font-weight: bold;
}

.explanation {
  color: #d0d0d0;
  line-height: 1.6;
}

.back {
  display: inline-block;
  padding: 10px 15px;
  margin-bottom: 15px;
  background: #15161b;
  border: 1px solid #444;
  border-radius: 9px;
  cursor: pointer;
}

footer {
  text-align: center;
  padding: 30px;
  color: #777;
}
</style>
</head>

<body>

<header>
  <h1>My SS2 Study Hub</h1>
  <p>Learn • Revise • Understand • Succeed</p>
</header>

<div class="container">

  <div class="subjects">

    <div class="subject" onclick="showSubject('biology', this)">
      🧬 Biology
    </div>

    <div class="subject" onclick="showSubject('physics', this)">
      ⚡ Physics
    </div>

    <div class="subject" onclick="showSubject('chemistry', this)">
      🧪 Chemistry
    </div>

    <div class="subject" onclick="showSubject('maths', this)">
      📐 Mathematics
    </div>

  </div>

  <div id="content">

    <div class="card">
      <h2>Welcome to My SS2 Study Hub</h2>
      <p>Choose a subject above to begin learning.</p>
    </div>

  </div>

</div>

<footer>
  My SS2 Study Hub
</footer>


<script>

const content = document.getElementById("content");


function clearActive() {

  document
    .querySelectorAll(".subject")
    .forEach(button => button.classList.remove("active"));

}


function showSubject(subject, button) {

  clearActive();

  button.classList.add("active");

  if (subject === "physics") {
    showPhysics();
  }

  else if (subject === "biology") {

    showSimple(
      "🧬 Biology",
      "Biology lessons and revision topics will appear here."
    );

  }

  else if (subject === "chemistry") {

    showSimple(
      "🧪 Chemistry",
      "Chemistry lessons and revision topics will appear here."
    );

  }

  else if (subject === "maths") {

    showSimple(
      "📐 Mathematics",
      "Mathematics lessons and revision topics will appear here."
    );

  }

}


function showSimple(title, text) {

  content.innerHTML = `

    <div class="back" onclick="goHome()">
      ← Back to Subjects
    </div>

    <div class="card">

      <h2>${title}</h2>

      <p>${text}</p>

    </div>

  `;

}


function goHome() {

  clearActive();

  content.innerHTML = `

    <div class="card">

      <h2>Welcome to My SS2 Study Hub</h2>

      <p>Choose a subject above to begin learning.</p>

    </div>

  `;

}


function showPhysics() {

  content.innerHTML = `

    <div class="back" onclick="goHome()">
      ← Back to Subjects
    </div>

    <div class="card">

      <h2>⚡ Physics</h2>

      <h3>WAEC Physics — Questions 22–50</h3>

      <p>
        Answers and explanations for Questions 22–50.
      </p>

    </div>

    ${physicsQuestions.map(q => `

      <div class="card">

        <h3>Question ${q.number}</h3>

        <p>${q.question}</p>

        <p class="answer">
          Answer: ${q.answer}
        </p>

        <p class="explanation">
          ${q.explanation}
        </p>

      </div>

    `).join("")}

  `;

}

</script>
