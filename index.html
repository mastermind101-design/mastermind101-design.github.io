<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>My SS2 Study Hub</title>

<style>
* {
    box-sizing: border-box;
}

body {
    margin: 0;
    font-family: Arial, sans-serif;
    background:
        radial-gradient(circle at 0% 0%, rgba(37,99,235,.20), transparent 30%),
        radial-gradient(circle at 100% 100%, rgba(124,58,237,.18), transparent 30%),
        #050505;
    color: #f5f5f5;
    min-height: 100vh;
}

header {
    text-align: center;
    padding: 35px 15px;
    background: rgba(10,10,20,.92);
    border-bottom: 1px solid rgba(100,150,255,.25);
    box-shadow: 0 0 35px rgba(37,99,235,.12);
}

.logo {
    font-size: 30px;
    font-weight: bold;
    letter-spacing: 2px;
}

.tagline {
    margin-top: 8px;
    color: #aab7d4;
    font-size: 15px;
}

.container {
    width: 92%;
    max-width: 1050px;
    margin: 30px auto;
}

.welcome {
    background: rgba(20,20,30,.88);
    padding: 25px;
    border-radius: 18px;
    border: 1px solid rgba(100,150,255,.18);
    margin-bottom: 25px;
}

.subject-grid {
    display: grid;
    grid-template-columns: repeat(auto-fit,minmax(180px,1fr));
    gap: 15px;
}

.subject-btn {
    border: none;
    padding: 22px 15px;
    border-radius: 15px;
    color: white;
    font-size: 17px;
    font-weight: bold;
    cursor: pointer;
    background: linear-gradient(135deg,#172554,#312e81);
    transition: .25s;
}

.subject-btn:hover {
    transform: translateY(-3px);
    box-shadow: 0 0 25px rgba(99,102,241,.28);
}

#content {
    margin-top: 30px;
}

.card {
    background: rgba(15,15,25,.94);
    border: 1px solid rgba(100,150,255,.18);
    border-radius: 18px;
    padding: 24px;
    margin-bottom: 20px;
    box-shadow: 0 0 25px rgba(30,60,150,.08);
}

.card h2 {
    color: #93c5fd;
    margin-top: 0;
}

.card h3 {
    color: #c4b5fd;
}

.topic-grid {
    display: grid;
    grid-template-columns: repeat(auto-fit,minmax(220px,1fr));
    gap: 14px;
    margin-top: 20px;
}

.topic-btn {
    background: #111827;
    color: white;
    border: 1px solid #26354f;
    padding: 18px;
    border-radius: 12px;
    cursor: pointer;
    text-align: left;
    font-size: 15px;
    transition: .2s;
}

.topic-btn:hover {
    background: #172554;
    border-color: #4f6db8;
}

.lesson {
    line-height: 1.7;
}

.term {
    color: #93c5fd;
    font-weight: bold;
}

.week {
    color: #a5b4fc;
    font-size: 13px;
    margin-bottom: 7px;
    font-weight: bold;
}

.break-card {
    border: 1px dashed #374151;
    background: rgba(17,24,39,.55);
}

.assignment {
    margin-top: 22px;
    padding: 18px;
    border-left: 4px solid #6366f1;
    background: rgba(49,46,129,.18);
    border-radius: 10px;
}

.back-btn {
    background: #1f2937;
    color: white;
    border: 1px solid #374151;
    padding: 10px 16px;
    border-radius: 9px;
    cursor: pointer;
    margin-bottom: 18px;
}

footer {
    text-align: center;
    padding: 30px 15px;
    color: #7f8aa3;
    font-size: 13px;
}

@media(max-width:600px) {
    .logo {
        font-size: 24px;
    }

    .container {
        width: 94%;
    }

    .card {
        padding: 18px;
    }
}
</style>
</head>

<body>

<header>
    <div class="logo">MY SS2 STUDY HUB</div>
    <div class="tagline">Learn • Revise • Understand • Succeed</div>
</header>

<div class="container">

    <div class="welcome">
        <h2>Welcome to My SS2 Study Hub</h2>
        <p>
            Your personal study space for revision, assignments and quizzes.
            Choose a subject below to begin.
        </p>
    </div>

    <div class="subject-grid">
        <button class="subject-btn" onclick="showBiology()">🧬 Biology</button>
        <button class="subject-btn" onclick="showChemistry()">⚗️ Chemistry</button>
        <button class="subject-btn" onclick="showPhysics()">⚡ Physics</button>
        <button class="subject-btn" onclick="showMath()">📐 Mathematics</button>
    </div>

    <div id="content"></div>

</div>

<footer>
    My SS2 Study Hub • Study smart. Stay consistent.
</footer>


<script>

/* =====================================================
   HOME
===================================================== */

function goHome() {
    document.getElementById("content").innerHTML = "";
    window.scrollTo({top:0, behavior:"smooth"});
}


/* =====================================================
   BIOLOGY
===================================================== */

function showBiology() {

    document.getElementById("content").innerHTML = `

    <div class="card">

        <button class="back-btn" onclick="goHome()">← Back to Subjects</button>

        <h2>🧬 Biology</h2>

        <p><b>Scheme of Work — Weeks 1–4</b></p>

        <div class="topic-grid">

            <button class="topic-btn" onclick="bioDigestive1()">
                <div class="week">WEEK 1</div>
                <b>Digestive System — Part 1</b>
            </button>

            <button class="topic-btn" onclick="bioDigestive2()">
                <div class="week">WEEK 2</div>
                <b>Digestive System — Part 2</b>
            </button>

            <button class="topic-btn" onclick="bioTransport1()">
                <div class="week">WEEK 3</div>
                <b>Transport System — Part 1</b>
            </button>

            <button class="topic-btn" onclick="bioTransport2()">
                <div class="week">WEEK 4</div>
                <b>Transport System — Part 2</b>
            </button>

        </div>

    </div>
    `;
}


/* BIOLOGY WEEK 1 */

function bioDigestive1() {

    document.getElementById("content").innerHTML = `

    <div class="card lesson">

        <button class="back-btn" onclick="showBiology()">← Back to Biology</button>

        <div class="week">WEEK 1</div>

        <h2>Digestive System — Part 1</h2>

        <h3>What is Digestion?</h3>

        <p>
            <span class="term">Digestion</span> is the breakdown of large,
            complex food molecules into smaller, simple, soluble substances
            that can be absorbed and used by the body.
        </p>

        <h3>The Alimentary Canal</h3>

        <p>
            The <span class="term">alimentary canal</span> is the continuous
            passage through which food travels during digestion. In mammals,
            it includes the mouth, pharynx, oesophagus, stomach, small
            intestine, large intestine, rectum and anus.
        </p>

        <h3>Digestion in the Mouth</h3>

        <p>
            Digestion begins in the mouth. Teeth break food into smaller
            pieces and mix it with saliva. Saliva contains the enzyme
            <span class="term">amylase (tyalin)</span>, which begins the
            digestion of starch.
        </p>

        <div class="assignment">
            <b>Revision Focus:</b>
            Know the meaning of digestion and the main parts of the
            mammalian alimentary canal.
        </div>

    </div>
    `;
}


/* BIOLOGY WEEK 2 */

function bioDigestive2() {

    document.getElementById("content").innerHTML = `

    <div class="card lesson">

        <button class="back-btn" onclick="showBiology()">← Back to Biology</button>

        <div class="week">WEEK 2</div>

        <h2>Digestive System — Part 2</h2>

        <h3>Digestion in the Stomach</h3>

        <p>
            Food moves from the mouth through the oesophagus by
            <span class="term">peristalsis</span> and enters the stomach.
            The stomach stores and churns food while gastric juice helps
            in protein digestion.
        </p>

        <p>
            The enzyme <span class="term">pepsin</span> helps break down
            proteins. Hydrochloric acid provides an acidic medium and
            helps destroy many microorganisms.
        </p>

        <h3>Digestion in the Small Intestine</h3>

        <p>
            In the small intestine, food mixes with pancreatic juice,
            intestinal juice and bile. Bile helps with the
            <span class="term">emulsification of fats</span>.
        </p>

        <h3>Absorption</h3>

        <p>
            The small intestine contains numerous
            <span class="term">villi</span> which increase the surface
            area for absorption. Digested nutrients enter the blood,
            while products of fat digestion enter the
            <span class="term">lacteals</span>.
        </p>

        <div class="assignment">
            <b>Revision Focus:</b>
            Remember the major digestive enzymes and the importance
            of villi in absorption.
        </div>

    </div>
    `;
}


/* BIOLOGY WEEK 3 */

function bioTransport1() {

    document.getElementById("content").innerHTML = `

    <div class="card lesson">

        <button class="back-btn" onclick="showBiology()">← Back to Biology</button>

        <div class="week">WEEK 3</div>

        <h2>Transport System — Part 1</h2>

        <h3>Meaning of Transport</h3>

        <p>
            <span class="term">Transport</span> is the movement of materials
            from where they are produced, absorbed or stored to places where
            they are needed or removed.
        </p>

        <h3>Why is Transport Necessary?</h3>

        <p>
            Cells need materials such as oxygen, water, nutrients and
            mineral salts. Waste products such as carbon dioxide and
            nitrogenous wastes must also be removed.
        </p>

        <h3>Transport in Small Organisms</h3>

        <p>
            Small organisms such as Amoeba and Paramecium can exchange
            many substances directly with their surroundings by
            <span class="term">diffusion</span>. Their large
            surface-area-to-volume ratio makes this possible.
        </p>

        <p>
            In larger organisms, diffusion alone is not fast enough,
            so specialised transport systems are required.
        </p>

        <div class="assignment">
            <b>Revision Focus:</b>
            Understand why diffusion is suitable for small organisms
            but insufficient for large multicellular organisms.
        </div>

    </div>
    `;
}


/* BIOLOGY WEEK 4 */

function bioTransport2() {

    document.getElementById("content").innerHTML = `

    <div class="card lesson">

        <button class="back-btn" onclick="showBiology()">← Back to Biology</button>

        <div class="week">WEEK 4</div>

        <h2>Transport System — Part 2</h2>

        <h3>Transport in Mammals</h3>

        <p>
            Mammals have a specialised circulatory system made up of the
            heart, blood and blood vessels. Blood transports substances
            around the body.
        </p>

        <h3>Blood</h3>

        <p>
            Blood contains <span class="term">plasma</span> and blood cells.
            Plasma transports dissolved substances including digested food,
            hormones, salts and waste products.
        </p>

        <h3>Blood Cells</h3>

        <p>
            <b>Red blood cells</b> transport oxygen using haemoglobin.
            <b>White blood cells</b> help defend the body against infection,
            while <b>platelets</b> help with blood clotting.
        </p>

        <h3>Blood Vessels</h3>

        <p>
            The three main blood vessels are
            <span class="term">arteries</span>,
            <span class="term">veins</span> and
            <span class="term">capillaries</span>.
            Arteries generally carry blood away from the heart, veins
            generally carry blood towards the heart, and capillaries are
            important sites of exchange.
        </p>

        <div class="assignment">
            <b>Revision Focus:</b>
            Learn the differences between arteries, veins and capillaries
            and the functions of the main blood cells.
        </div>

    </div>
    `;
}


/* =====================================================
   PHYSICS
===================================================== */

function showPhysics() {

    document.getElementById("content").innerHTML = `

    <div class="card">

        <button class="back-btn" onclick="goHome()">← Back to Subjects</button>

        <h2>⚡ Physics</h2>

        <p><b>Scheme of Work — Weeks 1–10</b></p>

        <div class="topic-grid">

            <button class="topic-btn" onclick="physicsLight1()">
                <div class="week">WEEKS 1–2</div>
                <b>Light Waves — Part 1 & 2</b>
            </button>

            <button class="topic-btn" onclick="physicsSound()">
                <div class="week">WEEK 3</div>
                <b>Sound Waves</b>
            </button>

            <button class="topic-btn" onclick="physicsEye()">
                <div class="week">WEEK 4</div>
                <b>Human Eye</b>
            </button>

            <div class="topic-btn break-card">
                <div class="week">WEEK 5</div>
                <b>Midterm Tests / Midterm Break</b>
                <p>No topic scheduled.</p>
            </div>

            <button class="topic-btn" onclick="physicsApplicationSound()">
                <div class="week">WEEK 6</div>
                <b>Application of Sound Waves</b>
            </button>

            <div class="topic-btn break-card">
                <div class="week">WEEK 7</div>
                <b>Midterm Break</b>
                <p>No topic scheduled.</p>
            </div>

            <button class="topic-btn" onclick="physicsCharges()">
                <div class="week">WEEK 8</div>
                <b>Electric Charges</b>
            </button>

            <button class="topic-btn" onclick="physicsFields()">
                <div class="week">WEEK 9</div>
                <b>Description and Properties of Fields</b>
            </button>

            <button class="topic-btn" onclick="physicsGravity()">
                <div class="week">WEEK 10</div>
                <b>Gravitational Field</b>
            </button>

        </div>

    </div>
    `;
}


function physicsLight1() {
    lessonPage(
        "WEEKS 1–2",
        "Light Waves — Part 1 & 2",
        "Light is a form of electromagnetic radiation that enables us to see objects. Light waves can travel through a vacuum and show properties such as reflection, refraction and diffraction.",
        "This topic introduces the nature and properties of light waves and how light behaves when it meets different materials."
    );
}

function physicsSound() {
    lessonPage(
        "WEEK 3",
        "Sound Waves",
        "Sound is produced by vibrating objects and travels through a medium as a wave. Sound cannot travel through a vacuum.",
        "Important ideas include vibration, frequency, wavelength, amplitude and the speed of sound."
    );
}

function physicsEye() {
    lessonPage(
        "WEEK 4",
        "Human Eye",
        "The human eye is a sense organ that detects light and allows us to see. It contains structures such as the cornea, iris, pupil, lens and retina.",
        "The eye focuses light onto the retina, where light-sensitive cells help form the information sent to the brain."
    );
}

function physicsApplicationSound() {
    lessonPage(
        "WEEK 6",
        "Application of Sound Waves",
        "Sound waves have many practical applications in science, medicine, communication and technology.",
        "Examples include medical scanning, communication systems, sonar and the study of objects using reflected sound."
    );
}

function physicsCharges() {
    lessonPage(
        "WEEK 8",
        "Electric Charges",
        "Electric charge is a property of matter responsible for electrical effects. There are two types of charge: positive and negative.",
        "Like charges repel while unlike charges attract. Electric charge is associated with particles such as protons and electrons."
    );
}

function physicsFields() {
    lessonPage(
        "WEEK 9",
        "Description and Properties of Fields",
        "A field is a region around an object where another object can experience a force.",
        "Fields can be represented using field lines. Examples include gravitational, electric and magnetic fields."
    );
}

function physicsGravity() {
    lessonPage(
        "WEEK 10",
        "Gravitational Field",
        "A gravitational field is the region around a mass in which another mass experiences a gravitational force.",
        "The gravitational field explains why objects are attracted towards massive bodies such as the Earth."
    );
}

function chemPollution() {
    lessonPage(
        "WEEK 1",
        "Water and Air Pollution",
        "Pollution occurs when harmful substances are introduced into the environment. Water pollution affects rivers, lakes and other water sources, while air pollution affects the atmosphere.",
        "The topic looks at common pollutants, their sources, effects on living organisms and ways pollution can be reduced."
    );
}

function chemElectrolysis() {
    lessonPage(
        "WEEK 2",
        "Electrolysis",
        "Electrolysis is the chemical decomposition of an electrolyte by passing an electric current through it.",
        "The process involves electrodes and the movement of ions. It is useful in the extraction and purification of some substances."
    );
}

function chemCells() {
    lessonPage(
        "WEEK 3",
        "Electrochemical Cells",
        "An electrochemical cell involves chemical and electrical energy being converted from one form to another.",
        "Electrochemical cells are important in batteries and other systems that produce or use electrical energy through chemical reactions."
    );
}

function chemTitration() {
    lessonPage(
        "WEEK 4",
        "Acid and Base Titration",
        "Titration is a laboratory method used to determine the concentration of a solution by reacting it with a solution of known concentration.",
        "Acid-base titration commonly uses an indicator to help identify the end point of the reaction."
    );
}

function chemTrial() {
    lessonPage(
        "WEEK 5",
        "Trial Titration and Calculations",
        "A trial titration is carried out first to obtain an approximate titre before more accurate titration readings are taken.",
        "The results can then be used in calculations involving concentration, volume and the mole relationship between reacting substances."
    );
}

function chemSolubility() {
    lessonPage(
        "WEEK 6",
        "Solubility and Solubility Curves",
        "Solubility describes the maximum amount of a substance that can dissolve in a given amount of solvent under specified conditions.",
        "Solubility curves show how the solubility of substances changes, commonly with temperature."
    );
}

function chemEquilibrium() {
    lessonPage(
        "WEEK 8",
        "Chemical Equilibrium",
        "Chemical equilibrium occurs in a reversible reaction when the forward and backward reactions occur at equal rates.",
        "At equilibrium, the concentrations of the substances remain constant even though the reactions continue."
    );
}

function chemKinetics() {
    lessonPage(
        "WEEK 9",
        "Chemical Kinetics",
        "Chemical kinetics is the study of the rate at which chemical reactions occur.",
        "Factors such as concentration, temperature, surface area and catalysts can affect reaction rate."
    );
}

function chemHeat() {
    lessonPage(
        "WEEK 10",
        "Heat of Reaction",
        "The heat of reaction is the amount of heat energy absorbed or released during a chemical reaction.",
        "Some reactions release heat while others absorb heat from their surroundings."
    );
}

function chemEnergetics() {
    lessonPage(
        "WEEK 11",
        "Energetics of Reactions",
        "Energetics deals with the energy changes that occur during chemical reactions.",
        "It helps us understand why some reactions are exothermic and others are endothermic."
    );
}

        "Trigonometry":
        "Trigonometry studies relationships between angles and sides of triangles.",

        "Statistics":
        "Statistics involves collecting, organising, presenting and interpreting data.",

        "Probability":
        "Probability measures how likely an event is to occur."
    };

    lessonPage(
        "",
        title,
        text[title],
        "This section can later be expanded with your school notes, worked examples and exercises."
    );
}


/* =====================================================
   GENERAL LESSON PAGE
===================================================== */

function lessonPage(week,title,meaning,details) {

    document.getElementById("content").innerHTML = `

    <div class="card lesson">

        <button class="back-btn" onclick="goHome()">← Back to Subjects</button>

        ${week ? `<div class="week">${week}</div>` : ""}

        <h2>${title}</h2>

        <h3>Introduction</h3>

        <p>${meaning}</p>

        <h3>What This Topic Covers</h3>

        <p>${details}</p>

        <div class="assignment">
            <b>Study Note:</b>
            This is a short introductory section for now.
            The full school note can be added here later.
        </div>

    </div>
    `;
}

</script>
