<title>My SS2 Study Hub</title>

<style>
* {
    box-sizing: border-box;
}

body {
    margin: 0;
    font-family: Arial, sans-serif;
    background:
        radial-gradient(circle at 0% 0%, rgba(37, 99, 235, 0.22), transparent 30%),

    color: #f5f5f5;
    min-height: 100vh;
}

header {
    text-align: center;
    padding: 35px 15px;
    background: rgba(10, 10, 20, 0.9);

    box-shadow: 0 0 35px rgba(37, 99, 235, 0.15);

.logo {

    letter-spacing: 2px;
}

.tagline {
    margin-top: 8px;

    font-size: 15px;
}

.container {
    width: 92%;
    max-width: 1000px;
    margin: 30px auto;
}

.welcome {

    padding: 25px;
    border-radius: 18px;
    border: 1px solid rgba(100, 150, 255, 0.18);
    margin-bottom: 25px;
    box-shadow: 0 0 25px rgba(50, 80, 200, 0.08);
}

.welcome h2 {
    margin-top: 0;
}

.subject-grid {
    display: grid;
    grid-template-columns: repeat(auto-fit, minmax(180px, 1fr));
    gap: 15px;
}

.subject-btn {
    border: none;
    padding: 22px 15px;
    border-radius: 15px;
    color: white;
    font-size: 17px;
    font-weight: bold;
    cursor: pointer;

    transition: 0.25s;
    box-shadow: 0 0 18px rgba(37, 99, 235, 0.12);
}

.subject-btn:hover {
    transform: translateY(-3px);
    box-shadow: 0 0 25px rgba(99, 102, 241, 0.3);
}

#content {
    margin-top: 30px;
}

.card {
    background: rgba(15, 15, 25, 0.92);
    border: 1px solid rgba(100, 150, 255, 0.18);
    border-radius: 18px;
    padding: 24px;
    margin-bottom: 20px;
    box-shadow: 0 0 25px rgba(30, 60, 150, 0.08);
}

.card h2 {
    color: #93c5fd;
    margin-top: 0;
}

.card h3 {
    color: #c4b5fd;
}

.topic-grid {
    display: grid;
    grid-template-columns: repeat(auto-fit, minmax(210px, 1fr));
    gap: 14px;
    margin-top: 20px;
}

.topic-btn {
    background: #111827;
    color: #f5f5f5;
    border: 1px solid #26354f;
    padding: 17px;
    border-radius: 12px;
    cursor: pointer;
    text-align: left;
    font-size: 15px;
    transition: 0.2s;
}

.topic-btn:hover {
    background: #172554;
    border-color: #4f6db8;
}

.lesson {
    line-height: 1.7;
}

.term {
    color: #93c5fd;
    font-weight: bold;
}

.assignment {
    margin-top: 22px;
    padding: 18px;
    border-left: 4px solid #6366f1;
    background: rgba(49, 46, 129, 0.18);
    border-radius: 10px;
}

.quiz {
    margin-top: 25px;
}

.question {
    background: #0b1120;
    padding: 18px;
    border-radius: 12px;
    margin-bottom: 15px;
    border: 1px solid #1e293b;
}

.question label {
    display: block;
    margin: 9px 0;
    cursor: pointer;
}

.quiz button {
    background: #4f46e5;
    color: white;
    border: none;
    padding: 13px 20px;
    border-radius: 10px;
    cursor: pointer;
    font-weight: bold;

.score {

    font-weight: bold;

.back-btn {

    color: white;

footer {

    padding: 30px 15px;

    .card {
        padding: 18px;
    }

</style>

/* =========================
   DIGESTIVE SYSTEM PART 1
========================= */

function showBioDigestive1() {

    document.getElementById("content").innerHTML = `

    <div class="card lesson">

        <button class="back-btn" onclick="showBiology()">← Back to Biology</button>

        <h2>Digestive System — Part 1</h2>

        <h3>Meaning of Digestion</h3>

        <p>
            <span class="term">Digestion</span> is the breakdown of large,
            complex food molecules into smaller, simple, soluble substances
            that can be absorbed and used by the body.
        </p>

        <p>
            The digestive system consists mainly of the
            <span class="term">alimentary canal</span> and the organs and
            glands associated with digestion and absorption.
        </p>

        <h3>The Alimentary Canal</h3>

        <p>
            In mammals, the alimentary canal is a long tube through which
            food passes. Its major parts include the mouth, pharynx,
            oesophagus, stomach, small intestine, large intestine,
            rectum and anus.
        </p>

        <h3>Digestive Systems in Different Animals</h3>

        <p>
            Different organisms have different digestive structures.
            For example, an earthworm has a mouth, pharynx, gullet,
            crop, gizzard, intestine and anus.
        </p>

        <p>
            Some simple organisms have very simple digestive arrangements,
            while organisms such as mammals possess a highly developed
            alimentary canal.
        </p>

        <h3>Digestion in the Mouth</h3>

        <p>
            Digestion begins in the mouth. The teeth break food into smaller
            pieces while the food is mixed with saliva.
        </p>

        <p>
            Saliva contains the enzyme <span class="term">amylase
            (tyalin)</span>, which begins the digestion of starch into
            maltose.
        </p>

        <div class="assignment">
            <h3>Quick Revision</h3>
            <p>
                Remember: <b>Digestion = large food molecules → small,
                soluble, absorbable molecules.</b>
            </p>
        </div>

    </div>
    `;
}


/* =========================
   DIGESTIVE SYSTEM PART 2
========================= */

function showBioDigestive2() {

    document.getElementById("content").innerHTML = `

    <div class="card lesson">

        <button class="back-btn" onclick="showBiology()">← Back to Biology</button>

        <h2>Digestive System — Part 2</h2>

        <h3>Digestion in the Stomach</h3>

        <p>
            After food is swallowed, it moves through the oesophagus
            by <span class="term">peristalsis</span> and enters the stomach.
        </p>

        <p>
            The stomach temporarily stores food and mixes it with
            gastric juice. Gastric juice contains substances including
            <span class="term">pepsin</span> and hydrochloric acid.
        </p>

        <p>
            Pepsin begins the digestion of proteins, while hydrochloric
            acid provides an acidic medium and helps destroy harmful
            microorganisms.
        </p>

        <h3>The Small Intestine</h3>

        <p>
            The partly digested food enters the duodenum. Here it mixes
            with pancreatic juice and bile.
        </p>

        <p>
            Pancreatic enzymes such as amylase, lipase and trypsin continue
            digestion. <span class="term">Bile</span>, produced by the liver,
            helps in the <span class="term">emulsification of fats</span>.
        </p>

        <h3>Absorption</h3>

        <p>
            The small intestine contains numerous tiny finger-like
            projections called <span class="term">villi</span>.
            They greatly increase the surface area for absorption.
        </p>

        <p>
            Digested nutrients such as glucose and amino acids enter
            the blood through the villi, while products of fat digestion
            enter the <span class="term">lacteals</span>.
        </p>

        <h3>End Products of Digestion</h3>

        <p>
            Proteins are finally broken down into amino acids.
            Fats and oils are broken down into fatty acids and glycerol,
            while starch is ultimately converted to glucose.
        </p>

        <div class="assignment">
            <h3>Quick Revision</h3>
            <p>
                Protein → amino acids<br>
                Fat → fatty acids + glycerol<br>
                Starch → glucose
            </p>
        </div>

    </div>
    `;
}


/* =========================
   TRANSPORT SYSTEM PART 1
========================= */

function showBioTransport1() {

    document.getElementById("content").innerHTML = `

    <div class="card lesson">

        <button class="back-btn" onclick="showBiology()">← Back to Biology</button>

        <h2>Transport System — Part 1</h2>

        <h3>Meaning of Transport</h3>

        <p>
            <span class="term">Transport</span> is the movement of substances
            from places where they are produced or absorbed to places where
            they are needed, stored or removed from the body.
        </p>

        <h3>Why Transport is Necessary</h3>

        <p>Transport systems are important because cells need materials such as:</p>

        <ul>
            <li>Oxygen for respiration</li>
            <li>Water</li>
            <li>Digested food such as glucose and amino acids</li>
            <li>Mineral salts</li>
            <li>Hormones</li>
        </ul>

        <p>
            Transport systems also remove waste products such as
            carbon dioxide, excess water and nitrogenous wastes.
        </p>

        <h3>Transport in Simple Organisms</h3>

        <p>
            Organisms such as Amoeba and Paramecium are small and have a
            large surface-area-to-volume ratio. They can therefore exchange
            many substances directly with their surroundings by
            <span class="term">diffusion</span>.
        </p>

        <h3>Why Large Organisms Need Transport Systems</h3>

        <p>
            As organisms become larger, their surface-area-to-volume ratio
            decreases. Diffusion alone becomes too slow to supply every cell
            with enough materials.
        </p>

        <p>
            Multicellular organisms therefore develop specialised transport
            systems to move substances quickly around the body.
        </p>

        <div class="assignment">
            <h3>Quick Revision</h3>
            <p>
                Small organisms can rely heavily on diffusion, while larger
                organisms need specialised transport systems.
            </p>
        </div>

    </div>
    `;
}


/* =========================
   TRANSPORT SYSTEM PART 2
========================= */

function showBioTransport2() {

    document.getElementById("content").innerHTML = `

    <div class="card lesson">

        <button class="back-btn" onclick="showBiology()">← Back to Biology</button>

        <h2>Transport System — Part 2</h2>

        <h3>Transport in Mammals</h3>

        <p>
            Mammals have a specialised circulatory system involving the
            <span class="term">heart</span>, blood vessels and blood.
            The blood transports substances around the body.
        </p>

        <h3>Blood</h3>

        <p>
            Blood consists of a liquid part called
            <span class="term">plasma</span> and blood cells.
            Plasma carries dissolved substances such as digested food,
            hormones, salts, waste products and some gases.
        </p>

        <h3>Main Blood Cells</h3>

        <ul>
            <li>
                <b>Red blood cells:</b> transport oxygen using haemoglobin.
            </li>

            <li>
                <b>White blood cells:</b> help defend the body against
                infection.
            </li>

            <li>
                <b>Platelets:</b> help in blood clotting.
            </li>
        </ul>

        <h3>Blood Vessels</h3>

        <p>
            The three major types of blood vessels are
            <span class="term">arteries</span>,
            <span class="term">veins</span> and
            <span class="term">capillaries</span>.
        </p>

        <p>
            Arteries generally carry blood away from the heart.
            Veins generally carry blood towards the heart.
            Capillaries are very small vessels where exchange of materials
            occurs between the blood and body tissues.
        </p>

        <h3>Transport in Plants</h3>

        <p>
            Plants transport water and mineral salts from the roots to other
            parts of the plant. Manufactured food is also transported from
            areas where it is produced to areas where it is needed.
        </p>

        <p>
            The movement of manufactured food in plants is called
            <span class="term">translocation</span>, while the loss of water
            vapour from leaves is known as <span class="term">transpiration</span>.
        </p>

        <div class="assignment">
            <h3>Quick Revision</h3>
            <p>
                Blood → main transport medium in mammals.<br>
                Arteries → away from heart.<br>
                Veins → towards heart.<br>
                Capillaries → exchange of materials.
            </p>
        </div>

    </div>
    `;
}

        <div class="question">
            <p><b>1. What is the value of 2 + 3?</b></p>
            <label><input type="radio" name="mq1" value="a"> 4</label>
            <label><input type="radio" name="mq1" value="b"> 5</label>
            <label><input type="radio" name="mq1" value="c"> 6</label>
        </div>

        <div class="question">
            <p><b>2. Which is a quadratic equation?</b></p>
            <label><input type="radio" name="mq2" value="a"> x + 2 = 0</label>
            <label><input type="radio" name="mq2" value="b"> x² + 3x + 2 = 0</label>
            <label><input type="radio" name="mq2" value="c"> 2x = 4</label>
        </div>

        <div class="question">
            <p><b>3. Which is a measure of central tendency?</b></p>
            <label><input type="radio" name="mq3" value="a"> Mean</label>
            <label><input type="radio" name="mq3" value="b"> Angle</label>
            <label><input type="radio" name="mq3" value="c"> Radius</label>
        </div>

        <button onclick="checkMathQuiz()">Check Score</button>

        <div id="mathScore" class="score"></div>

    </div>
    `;
}

function checkMathQuiz() {

    let score = 0;

    if (document.querySelector('input[name="mq1"]:checked')?.value === "b") score++;
    if (document.querySelector('input[name="mq2"]:checked')?.value === "b") score++;
    if (document.querySelector('input[name="mq3"]:checked')?.value === "a") score++;

    document.getElementById("mathScore").innerText =
        "You scored " + score + " / 3";
}

                and practise questions on the topic.

    `;
}

    document.getElementById("content").innerHTML = "";
